schema: xgc2.product.v1
id: xgc2-ros-msgs
name: XGC2 ROS1 Messages
version: 1.2.0-11
kind: ros1-apt
summary: Shared ROS1 message interfaces for XGC2 components.
ros:
  distro: melodic,noetic
  packages:
  - xgc_camera_msgs
  - state_machine_msgs
  - hover_thrust_estimator_msgs
  - rigid_state_estimator_msgs
  - multirotor_reference_trajectory_msgs
  - px4_multirotor_controller_msgs
  - unicycle_reference_trajectory_msgs
apt:
  distribution: bionic,focal
  install:
  - ros-noetic-xgc2-ros-msgs
  packages:
  - ros-melodic-xgc2-camera-msgs
  - ros-melodic-xgc2-state-machine-msgs
  - ros-melodic-xgc2-estimator-hover-thrust-msgs
  - ros-melodic-xgc2-estimator-rigid-state-msgs
  - ros-melodic-xgc2-multirotor-reference-trajectory-msgs
  - ros-melodic-xgc2-px4-multirotor-controller-msgs
  - ros-melodic-xgc2-unicycle-reference-trajectory-msgs
  - ros-melodic-xgc2-ros-msgs
  - ros-noetic-xgc2-camera-msgs
  - ros-noetic-xgc2-state-machine-msgs
  - ros-noetic-xgc2-estimator-hover-thrust-msgs
  - ros-noetic-xgc2-estimator-rigid-state-msgs
  - ros-noetic-xgc2-multirotor-reference-trajectory-msgs
  - ros-noetic-xgc2-px4-multirotor-controller-msgs
  - ros-noetic-xgc2-unicycle-reference-trajectory-msgs
  - ros-noetic-xgc2-ros-msgs
  depends:
  - ros-noetic-message-runtime
  - ros-noetic-std-msgs
  - ros-noetic-geometry-msgs
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-ros-msgs

    '
  smoke_test: 'rospack find state_machine_msgs

    rospack find xgc_camera_msgs

    rospack find hover_thrust_estimator_msgs

    rospack find rigid_state_estimator_msgs

    '
ownership:
  paths:
  - /opt/ros/noetic/share/xgc_camera_msgs
  - /opt/ros/noetic/share/state_machine_msgs
  - /opt/ros/noetic/share/hover_thrust_estimator_msgs
  - /opt/ros/noetic/share/rigid_state_estimator_msgs
  - /opt/ros/noetic/share/multirotor_reference_trajectory_msgs
  - /opt/ros/noetic/share/px4_multirotor_controller_msgs
  - /opt/ros/noetic/share/unicycle_reference_trajectory_msgs
release:
  apt_versions:
    bionic: 1.2.0-11
    focal: 1.2.0-11
